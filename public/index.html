<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="inventory.js"></script>
    <script src="addProductForm.js"></script>
    <title>Team 5</title>
</head>
<body>

    <main>

        <header class="header">
                <div class="container">
                    <h2 class="logo">Team 5 Store Inventory</h2>
                    <nav aria-label="primary">
                        <ul class="nav">
                            <li><button id="addProduct" class=" btn add-product-btn" aria-label="Add Inventory">Add Product</button></li>
                        </ul>
                    </nav>
                </div>
            </header>

        <section class="hero">
            <div class="container hero-container">
                <h2>Welcome back, Team 5!</h2>
                <p>Here's the inventory summary for today.</p>
            </div>
            <div class="container inventory-summary-container">
                <div class="cards">
                    <div class="widget-card total-product-count">
                        <div class="card-content">
                            <h3>Total Product</h3>
                            <p id="total-product-count">0</p>
                        </div>
                    </div>
                    <div class="widget-card low-stock-count">
                        <div class="card-content">
                            <h3>Low Stock Items</h3>
                            <p id="low-stock-count">0</p>
                        </div>
                    </div>
                    <div>
                        <div class="widget-card out-of-stock-count">
                            <div class="card-content">
                                <h3>Out of Stock</h3>
                                <p id="out-of-stock-count">0</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

            

        <section class="inventory-table">
            <div class="container">
          
                <div class="table-section">
                    <div class="table-toolbar">
                        <div class="form">
                            <button>
                                <svg width="17" height="16" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="search">
                                    <path d="M7.667 12.667A5.333 5.333 0 107.667 2a5.333 5.333 0 000 10.667zM14.334 14l-2.9-2.9" stroke="currentColor" stroke-width="1.333" stroke-linecap="round" stroke-linejoin="round"></path>
                                </svg>
                            </button>
                            <input type="text" id="search-input" placeholder="Search product..." aria-label="Search products" oninput="searchProducts(this.value)"
>

                        </div>

                        <div class="table-filters">
                            <button id="total-product-count" class="filter-button total" data-filter="all">Total Product</button>
                        </div>
                    </div>

                    <div class="table-wrapper">
                        <table aria-label="Inventory Table">
                            <thead class="table-header">
                              <tr>
                                <th>No.</th>
                                <th>Product Name</th>
                                <th>Quantity</th>
                                <th>Price</th>
                                <th>Category</th>
                                <th>Actions</th>
                              </tr>
                            </thead>
                            <tbody id="products-tbody">
                                <!-- Products will be dynamically inserted here -->
                            </tbody>
                          </table>                      
                    </div>



                    <div class="modal" aria-hidden="true">
                    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="add-item-modal">
                        <span class="close-button" id="close-button" aria-label="Close Modal">&times;</span>
                        <h2>Add New Product</h2>
                        <form id="add-item-form">
                            <label for="item-name">Item Name:</label>
                            <input type="text" id="item-name" name="item-name" required>
                        
                        
                            <label for="quantity">Quantity:</label>
                            <input type="number" id="quantity" name="quantity" min="0" required>
                        
                        
                            <label for="price">Price (₱):</label>
                            <input type="number" id="price" name="price" min="0" step="0.01" required>
                        
                        
                            <label for="category">Category:</label>
                            <select id="category" name="category" aria-placeholder="category" required>
                                <option value="Beverages">Beverages</option>
                                <option value="Instant Food">Instant Food</option>
                                <option value="Household">Household</option>
                                <option value="Personal Care">Personal Care</option>
                                <option value="Others">Others</option>
                            </select>
                        
                        
                            <button type="submit" class="submit-button">Add Product</button>
                        </form>
                    </div>
                    </div>

                    <!-- Edit Product Modal -->
                    <div class="modal" id="edit-modal" aria-hidden="true">
                        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="edit-item-modal">
                            <span class="close-button" id="close-edit-button" aria-label="Close Modal">&times;</span>
                            <h2>Edit Product</h2>
                            <form id="edit-item-form">
                                <input type="hidden" id="edit-product-id">
                                <label for="edit-item-name">Item Name:</label>
                                <input type="text" id="edit-item-name" name="edit-item-name" required>
                            
                                <label for="edit-quantity">Quantity:</label>
                                <input type="number" id="edit-quantity" name="edit-quantity" min="0" required>
                            
                                <label for="edit-price">Price (₱):</label>
                                <input type="number" id="edit-price" name="edit-price" min="0" step="0.01" required>
                            
                                <label for="edit-category">Category:</label>
                                <select id="edit-category" name="edit-category" aria-placeholder="category" required>
                                    <option value="Beverages">Beverages</option>
                                    <option value="Instant Food">Instant Food</option>
                                    <option value="Household">Household</option>
                                    <option value="Personal Care">Personal Care</option>
                                    <option value="Others">Others</option>
                                </select>
                            
                                <button type="submit" class="submit-button">Update Product</button>
                            </form>
                        </div>
                    </div>

                </div>
                
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; <span id="year">2025</span> Team 5. All rights reserved.</p>    
    </footer>
</body>
</html>
